# Posts "Risk of Deadlock <version> is out on Thunderstore" to the Discord #update channel whenever the Thunderstore page
# (https://thunderstore.io/c/riskofrain2/p/JakeHornerMan/Risk_of_Deadlock/) gets a new approved version. Thunderstore has no
# subscribe/RSS/webhook for a package, so this checks it every hour (creator, 2026-11-10: "subscribe to the thunderstore page
# and post when that changes"). It stays on for good: the last version it posted is kept in posted.txt on the branch
# ts-watch-state, so each version is posted once. Needs the repo secret DISCORD_UPDATE_WEBHOOK (the #update webhook link; it
# never appears in the repo or the log). Doc 03 §5.
name: Thunderstore live watch
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: thunderstore-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post when Thunderstore has a new approved version
        env:
          DISCORD_UPDATE_WEBHOOK: ${{ secrets.DISCORD_UPDATE_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_UPDATE_WEBHOOK" ]; then echo "The repo secret DISCORD_UPDATE_WEBHOOK is missing"; exit 1; fi
          v=$(python3 tools/discord_update.py --ts-latest)
          last=""
          if git fetch -q origin ts-watch-state 2>/dev/null; then last=$(git show FETCH_HEAD:posted.txt | tr -d '[:space:]'); fi
          echo "Thunderstore's latest: $v; last posted: ${last:-none}"
          if [ "$v" = "$last" ]; then echo "Nothing new"; exit 0; fi
          python3 tools/discord_update.py "$v" --thunderstore --if-live | tee out.txt
          if grep -q "posted to #update" out.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git checkout -q --orphan ts-watch-state
            git rm -rqf --cached .
            echo "$v" > posted.txt
            git add posted.txt
            git commit -qm "Thunderstore watch: posted $v to #update"
            git push -qf origin ts-watch-state
          fi
